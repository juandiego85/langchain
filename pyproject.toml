[project]
name = "agenticaicourse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain==1.4.6",
    "langchain-community==0.4.2",
    "langchain-google-genai==4.4.2",
    "langchain-groq==1.1.3",
    "langchain-openai==1.7.2",
    "langgraph==1.2.16",
    "python-dotenv==1.2.4",
    "langchain-classic==1.0.8",
    "ipykernel>=7.4.0",
    "langsmith>=0.14.11",
    "langchain-tavily>=0.2.18",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.30.0",
    "langchain-core>=1.6.12",
    "pypdf>=7.1.0",
    "pymupdf>=2.1",
    "sentence-transformers>=6.3.0",
    "faiss-cpu>=1.16.0",
    "chromadb>=1.5.9",
    "pageindex>=0.7.5",
    "openai>=3.35.1",
    "deepagents>=0.7.30",
    "tavily-python>=0.8.5",
]

[project.scripts]
agenticaicourse = "agenticaicourse:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
