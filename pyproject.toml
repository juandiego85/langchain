[project]
name = "agenticaicourse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain==1.4.6",
    "langchain_community==0.4.2",
    "langchain_google_genai==4.4.2",
    "langchain_groq==1.1.3",
    "langchain_openai==1.7.2",
    "langgraph==1.2.16",
    "python-dotenv==1.2.4",
    "langchain-classic==1.0.8",
    "ipykernel>=7.4.0",
]

[project.scripts]
agenticaicourse = "agenticaicourse:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
